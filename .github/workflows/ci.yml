# Name shown in the "Actions" tab on GitHub
name: CI

# When to run: on every push to the main branch, and on every pull request
on:
  push:
    branches: ["main", "master"]
  pull_request:

# The job can read the repository and nothing else. It uses no secrets:
# every value the tests need is a fake one from .env.test.
permissions:
  contents: read

jobs:
  # Branch protection on main requires a check with this exact name.
  # Renaming this job means updating that rule in the same change.
  check:
    # The machine type: a fresh Ubuntu Linux server
    runs-on: ubuntu-latest

    services:
      # The throwaway test database, like docker-compose.test.yml on your laptop.
      # These fake values must match .env.test.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fake-db-user
          POSTGRES_PASSWORD: fake-db-password
          POSTGRES_DB: compliance_tracker_test
        ports:
          # left = this machine, right = inside the container. The guard requires 5433.
          - 5433:5432
        # Wait until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U fake-db-user -d compliance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # 1. Download your repository code onto the machine.
      #    fetch-depth 0 gets the full history, which step 8 needs to compare with main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Node.js. "cache: npm" saves downloaded packages for faster reruns
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install exact versions from package-lock.json (stricter than npm install).
      #    HUSKY=0 skips installing git hooks, which make no sense on a server.
      - run: npm ci
        env:
          HUSKY: 0

      # 4. Build the Prisma client (it is gitignored, so it must be generated here).
      #    The URL is a dummy: generating code does not connect to any database.
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"

      # 5. Run the same check you run locally: eslint + prettier + typescript
      - run: npm run check
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"

      # 6. Run every Vitest test. They read .env.test themselves and create the tables.
      #    The browser test stays on your laptop for now.
      - run: npm test

      # 7. Prove the hook that guards Claude's commands still works.
      - run: node test/hook-test/block-destructive.test.mjs

      # 8. On a PR, fail if a migration already on the target branch was changed.
      #    M = edited, D = deleted, R = renamed. A new migration (A) is fine.
      - name: Block changes to merged migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" -- prisma/migrations)
          if [ -n "$changed" ]; then
            echo "Merged migrations must not change. Write a new migration instead:"
            echo "$changed"
            exit 1
          fi

  # Runs only after a merge to main, and only if "check" passed.
  # Order inside: build both images on the runner, scan them, and only then log in and push.
  # A bad image never reaches the registry, and the scanner runs before any registry login exists.
  build-and-push:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Write access to packages lives on this job only. The workflow default stays read-only.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      # persist-credentials false: do not leave the token inside .git/config for later steps.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # First 7 characters of the commit id, the same style as the manual tags.
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # 1. App image: build it and keep it on this runner only (nothing is pushed yet).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/m-n-hossain/compliance-tracker:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Scan the app image. A HIGH or CRITICAL finding that has a fix fails the job.
      #    Pinned to a full commit id (release v0.36.0), not to a tag. A tag can be moved.
      #    Check this id on the release page before you commit it.
      - name: Scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/m-n-hossain/compliance-tracker:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 3. Migrate image: same idea, but only reported for now (it never faces the internet).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          load: true
          tags: ghcr.io/m-n-hossain/compliance-tracker-migrate:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan migrate image (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/m-n-hossain/compliance-tracker-migrate:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # 4. Only now log in to the registry. Both scans have passed.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Push. The build is cached, so this is fast.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ghcr.io/m-n-hossain/compliance-tracker-migrate:${{ steps.vars.outputs.tag }}
          cache-from: type=gha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/m-n-hossain/compliance-tracker:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
