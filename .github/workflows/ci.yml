# Name shown in the "Actions" tab on GitHub
name: CI

# When to run: on every push to the main branch, and on every pull request
on:
  push:
    branches: ["main", "master"]
  pull_request:

# The job can read the repository and nothing else. It uses no secrets:
# every value the tests need is a fake one from .env.test.
permissions:
  contents: read

jobs:
  # Branch protection on main requires a check with this exact name.
  # Renaming this job means updating that rule in the same change.
  check:
    # The machine type: a fresh Ubuntu Linux server
    runs-on: ubuntu-latest

    services:
      # The throwaway test database, like docker-compose.test.yml on your laptop.
      # These fake values must match .env.test.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fake-db-user
          POSTGRES_PASSWORD: fake-db-password
          POSTGRES_DB: compliance_tracker_test
        ports:
          # left = this machine, right = inside the container. The guard requires 5433.
          - 5433:5432
        # Wait until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U fake-db-user -d compliance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # 1. Download your repository code onto the machine
      - uses: actions/checkout@v4

      # 2. Install Node.js. "cache: npm" saves downloaded packages for faster reruns
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install exact versions from package-lock.json (stricter than npm install).
      #    HUSKY=0 skips installing git hooks, which make no sense on a server.
      - run: npm ci
        env:
          HUSKY: 0

      # 4. Build the Prisma client (it is gitignored, so it must be generated here).
      #    The URL is a dummy: generating code does not connect to any database.
      - run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"

      # 5. Run the same check you run locally: eslint + prettier + typescript
      - run: npm run check
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/dummy"

      # 6. Run every Vitest test. They read .env.test themselves and create the tables.
      #    The browser test stays on your laptop for now.
      - run: npm test

      # 7. Prove the hook that guards Claude's commands still works.
      - run: node test/hook-test/block-destructive.test.mjs
